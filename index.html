<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial PRISM v0.3 · Pearl Clear</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e9edf5;background:#0c1220;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:19px 20px;background:#111b2d;border-bottom:1px solid #29374c;display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{margin:0;font-size:22px;letter-spacing:.06em}header small{color:#a7b8d1}.shell{max-width:1100px;margin:auto;padding:18px}nav{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:5px}nav button,.secondary{border:1px solid #33445c;background:#1b2a41;color:#e8effb;border-radius:11px;padding:10px 13px;white-space:nowrap}nav button.active{background:#315b91;border-color:#6da7e6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#152238;border:1px solid #2c3d55;border-radius:17px;padding:17px;margin-bottom:13px;min-width:0}.card h2{font-size:16px;margin:0 0 14px}.metric{font-size:27px;font-weight:750;margin:7px 0}.muted{color:#9fb0c8;font-size:13px}.good{color:#65d7ae}.bad{color:#ff8c91}.warn{color:#f2c777}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:11px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}label{display:grid;gap:5px;color:#b9c7da;font-size:13px}input,select{width:100%;border:1px solid #41516a;background:#0d1829;color:#f2f5fb;padding:11px;border-radius:10px;min-width:0}input[type=checkbox]{width:auto}button.primary{background:#66c6b0;color:#0c2425;border:0;border-radius:10px;padding:11px 15px;font-weight:700}.danger{color:#ff9ca0}.item{padding:11px 0;border-bottom:1px solid #2a3950}.item:last-child{border:0}.bar{height:9px;background:#2c3b50;border-radius:20px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#62b7e8}.fill.over{background:#ed8b84}.actions{display:flex;flex-wrap:wrap;gap:8px}.tiny{font-size:12px;padding:5px 8px!important}.hidden{display:none}.wide{grid-column:1/-1}.notice{padding:12px;border:1px solid #476078;border-radius:12px;color:#c3d7ea;background:#182b43;margin-bottom:14px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid #304058;text-align:left;white-space:nowrap}th{color:#9fb0c8}canvas{width:100%;height:210px;display:block}.pill{font-size:11px;border:1px solid #4a6079;border-radius:20px;padding:3px 7px;color:#b6c9e2}@media(max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.shell{padding:12px}.card{padding:13px}.metric{font-size:23px}.grid>.card:last-child:nth-child(odd){grid-column:1/-1}}@media(max-width:390px){.grid{grid-template-columns:1fr}}

</style></head><body><header><div><h1>◈ FINANCIAL PRISM</h1><small>v0.3 · Pearl Clear · Your money, in focus</small></div><span class="pill" id="mode">LOCAL ONLY</span></header><main class="shell"><div class="notice" id="notice">Your data stays in this browser's local storage. It is not encrypted and can be lost if browser data is cleared. Export backups regularly, and keep them somewhere secure. No bank connection or external libraries.</div><nav id="tabs"></nav><div id="app"></div></main><script>
'use strict';const KEY='financial-prism-v01';const cats=['Housing','Utilities','Groceries','Dining','Transportation','Insurance','Health','Children & Family','Entertainment','Shopping','Subscriptions','Debt Payments','Savings','Other'];const today=()=>new Date().toLocaleDateString('en-CA');const month=()=>today().slice(0,7);const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const addDays=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};const defaultData=()=>({accounts:[{id:'checking',name:'Checking',balance:0,type:'cash'}],transactions:[],budgets:{},recurring:[],settings:{buffer:500},demo:false});let db;try{db=JSON.parse(localStorage.getItem(KEY))||defaultData()}catch{db=defaultData()}let tab='overview';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Browser storage failed. Export a backup and check available storage.')}};const account=id=>db.accounts.find(a=>a.id===id);const balances=()=>Object.fromEntries(db.accounts.map(a=>[a.id,Number(a.balance)||0]));function actualBalances(){let b=balances();for(const t of db.transactions){if(t.date>today())continue;let a=Number(t.amount)||0;if(t.type==='income')b[t.account]=(b[t.account]||0)+a;if(t.type==='expense')b[t.account]=(b[t.account]||0)-a;if(t.type==='transfer'){b[t.account]=(b[t.account]||0)-a;b[t.to]=(b[t.to]||0)+a}}return b}const cashTotal=()=>db.accounts.filter(a=>a.type==='cash').reduce((s,a)=>s+(actualBalances()[a.id]||0),0);const spend=(category,m=month())=>db.transactions.filter(t=>t.type==='expense'&&t.category===category&&t.date.slice(0,7)===m).reduce((s,t)=>s+Number(t.amount),0);const totalSpend=()=>db.transactions.filter(t=>t.type==='expense'&&t.date.slice(0,7)===month()).reduce((s,t)=>s+Number(t.amount),0);const totalIncome=()=>db.transactions.filter(t=>t.type==='income'&&t.date.slice(0,7)===month()).reduce((s,t)=>s+Number(t.amount),0);const options=(arr,selected)=>arr.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('');const accountOptions=(selected,filter)=>db.accounts.filter(a=>!filter||a.type===filter).map(a=>`<option value="${esc(a.id)}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('');const heading=t=>`<h2>${t}</h2>`;function schedule(r,start,end){let out=[];let d=new Date(start+'T12:00:00');const stop=new Date(end+'T12:00:00');for(;d<=stop;d.setDate(d.getDate()+1)){let date=d.toLocaleDateString('en-CA');if(date<r.start||r.end&&date>r.end)continue;let day=d.getDate(),first=r.start.slice(8);let ok=r.frequency==='monthly'?(day===Math.min(Number(r.day||first),new Date(d.getFullYear(),d.getMonth()+1,0).getDate())):r.frequency==='weekly'?(Math.round((new Date(date+'T12:00:00')-new Date(r.start+'T12:00:00'))/86400000)%7===0):r.frequency==='biweekly'?(Math.round((new Date(date+'T12:00:00')-new Date(r.start+'T12:00:00'))/86400000)%14===0):date===r.start;if(ok)out.push({date,amount:Number(r.amount),type:r.type,name:r.name,account:r.account,category:r.category})}return out}function upcoming(days=30){return db.recurring.flatMap(r=>schedule(r,addDays(today(),1),addDays(today(),days))).concat(db.transactions.filter(t=>t.date>today()&&t.date<=addDays(today(),days)&&t.type!=='transfer').map(t=>({...t,name:t.note||t.category||t.type}))).sort((a,b)=>a.date.localeCompare(b.date))}function forecast(days=30){let start=cashTotal(),balance=start,points=[{date:today(),balance}];let events=upcoming(days).filter(e=>account(e.account)?.type==='cash');for(let i=1;i<=days;i++){let date=addDays(today(),i);for(let e of events.filter(e=>e.date===date))balance+=e.type==='income'?e.amount:-e.amount;points.push({date,balance})}return {points,events,ending:balance,min:Math.min(...points.map(p=>p.balance))}}function lineChart(points){let w=780,h=220,pad=35,values=points.map(p=>p.balance),lo=Math.min(...values,0),hi=Math.max(...values,0),range=hi-lo||1;let xy=points.map((p,i)=>[pad+i/(points.length-1)*(w-pad*2),h-pad-(p.balance-lo)/range*(h-pad*2)]);let path=xy.map((p,i)=>(i?'L':'M')+p.join(',')).join(' ');let zero=h-pad-(0-lo)/range*(h-pad*2);return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Projected cash balance over 30 days" style="width:100%;height:auto"><line x1="${pad}" y1="${zero}" x2="${w-pad}" y2="${zero}" stroke="#64748b" stroke-dasharray="5 5"/><path d="${path}" fill="none" stroke="#4d9e93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="${pad}" y="15" fill="#62748a" font-size="15">${esc(money(hi))}</text><text x="${pad}" y="${h-6}" fill="#62748a" font-size="15">${esc(money(lo))}</text><text x="${w-125}" y="${h-6}" fill="#62748a" font-size="15">+30 days</text></svg>`}function overview(){let f=forecast(),budget=Object.values(db.budgets).reduce((s,n)=>s+Number(n),0);return `<div class="grid"><section class="card"><div class="muted">Cash accounts now</div><div class="metric">${money(cashTotal())}</div><div class="muted">Checking + savings + cash</div></section><section class="card"><div class="muted">30-day projected cash</div><div class="metric ${f.ending<0?'bad':'good'}">${money(f.ending)}</div><div class="muted">Based on scheduled entries</div></section><section class="card"><div class="muted">This month's spending</div><div class="metric">${money(totalSpend())}</div><div class="muted">${money(totalIncome())} recorded income</div></section></div><section class="card">${heading('Cash-flow outlook')} ${lineChart(f.points)}<div class="row"><span class="muted">Lowest projected balance: <strong class="${f.min<0?'bad':'good'}">${money(f.min)}</strong></span><span class="muted">Safety buffer: ${money(db.settings.buffer)}</span></div>${f.min<db.settings.buffer?'<p class="warn">⚠ Projected cash drops below your safety buffer.</p>':''}</section><section class="card">${heading('Budget pulse')}<p class="muted">${money(totalSpend())} spent · ${money(budget)} total assigned across categories</p>${cats.filter(c=>db.budgets[c]>0).map(c=>barRow(c,spend(c),Number(db.budgets[c]))).join('')||'<p class="muted">Set category limits in Budgets to see your spending pulse.</p>'}</section><section class="card">${heading('Next scheduled items')} ${f.events.slice(0,8).map(e=>`<div class="row item"><span>${esc(e.name)} <span class="muted">${esc(e.date)}</span></span><strong class="${e.type==='income'?'good':''}">${e.type==='income'?'+':'−'}${money(e.amount)}</strong></div>`).join('')||'<p class="muted">No upcoming items. Add recurring bills and income to improve the forecast.</p>'}</section>`}function barRow(c,s,b){let pct=b?s/b*100:0;return `<div class="item"><div class="row"><strong>${esc(c)}</strong><span class="muted">${money(s)} / ${money(b)}</span></div><div class="bar"><div class="fill ${pct>100?'over':''}" style="width:${Math.min(100,pct)}%"></div></div><div class="muted">${pct>100?money(s-b)+' over budget':money(b-s)+' remaining'}</div></div>`}function transactions(){return `<section class="card">${heading('Add a transaction')}<form id="txForm" class="stack"><div class="formgrid"><label>Type<select name="type" id="txType"><option value="expense">Expense</option><option value="income">Income</option><option value="transfer">Transfer between accounts</option></select></label><label>Amount ($)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Date<input name="date" type="date" value="${today()}" required></label><label>Account<select name="account">${accountOptions()}</select></label><label>Category<select name="category">${options(cats)}</select></label><label>Destination account (transfers only)<select name="to"><option value="">Select destination</option>${accountOptions()}</select></label><label class="wide">Note (optional)<input name="note" maxlength="150" placeholder="What was this for?"></label></div><button class="primary" type="submit">Save transaction</button></form></section><section class="card">${heading('Transaction history')}<div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Category / Note</th><th>Amount</th><th>Action</th></tr></thead><tbody>${[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.type)}</td><td>${esc(t.note||t.category||'Transfer')}</td><td>${money(t.amount)}</td><td><button class="secondary tiny danger" data-delete="tx" data-id="${esc(t.id)}">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No transactions yet.</td></tr>'}</tbody></table></div></section>`}function budgets(){return `<section class="card">${heading('Monthly category budgets')}<p class="muted">Set spending ceilings for each category. Zero means no limit. These limits repeat each month.</p><form id="budgetForm" class="stack">${cats.map(c=>`<label class="row"><span>${esc(c)}<small class="muted" style="display:block">Spent ${money(spend(c))}</small></span><input style="max-width:155px" type="number" min="0" step="1" name="${esc(c)}" value="${Number(db.budgets[c])||0}"></label>`).join('')}<button class="primary">Save budgets</button></form></section>`}function accounts(){let b=actualBalances();return `<section class="card">${heading('Your accounts')}<p class="muted">Starting balances represent the balance immediately before transactions recorded in PRISM. Do not re-enter transactions already included in that starting balance.</p>${db.accounts.map(a=>`<div class="row item"><div><strong>${esc(a.name)}</strong><div class="muted">${a.type==='cash'?'Cash / checking / savings':'Credit / debt'} · Starting ${money(a.balance)}</div></div><div style="text-align:right"><strong>${money(b[a.id])}</strong><div><button class="secondary tiny" data-edit-account="${esc(a.id)}">Edit</button> <button class="secondary tiny danger" data-delete="account" data-id="${esc(a.id)}">Delete</button></div></div></div>`).join('')}</section><section class="card">${heading('Add account')}<form id="accountForm" class="formgrid"><label>Account nickname<input name="name" maxlength="45" required placeholder="Checking, Visa, etc."></label><label>Account type<select name="type"><option value="cash">Cash / checking / savings</option><option value="debt">Credit card / loan</option></select></label><label>Starting balance ($)<input name="balance" type="number" step="0.01" required placeholder="0.00"></label><div style="align-self:end"><button class="primary">Add account</button></div></form><p class="muted">For debt accounts, enter the amount owed as a negative balance. This version tracks balances, not automatic interest accrual.</p></section>`}function recurring(){return `<section class="card">${heading('Add recurring income or bill')}<form id="recForm" class="formgrid"><label>Name<input name="name" required maxlength="60" placeholder="Paycheck, rent, internet..."></label><label>Type<select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></label><label>Amount ($)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Frequency<select name="frequency"><option value="monthly">Monthly</option><option value="biweekly">Every 2 weeks</option><option value="weekly">Weekly</option><option value="once">One time</option></select></label><label>First scheduled date<input name="start" type="date" value="${addDays(today(),1)}" required></label><label>Account<select name="account">${accountOptions(null,'cash')}</select></label><label>Category<select name="category">${options(cats)}</select></label><label>Optional end date<input name="end" type="date"></label><div class="wide"><button class="primary">Add scheduled item</button></div></form><p class="muted">Recurring entries affect forecasts only. They do not automatically post as actual transactions. Record the actual payment separately when it happens, and avoid entering future transactions that duplicate the schedule.</p></section><section class="card">${heading('Scheduled items')}${db.recurring.map(r=>`<div class="row item"><div><strong>${esc(r.name)}</strong><div class="muted">${esc(r.frequency)} · starting ${esc(r.start)}</div></div><div>${money(r.amount)} <button class="secondary tiny danger" data-delete="rec" data-id="${esc(r.id)}">Delete</button></div></div>`).join('')||'<p class="muted">Nothing scheduled yet.</p>'}</section>`}function planner(){let f=forecast();return `<section class="card">${heading('Can I afford this?')}<p class="muted">A conservative check using your lowest projected cash balance over the next 30 days, less your safety buffer. This does not reserve money for unspecified future expenses.</p><form id="planForm" class="formgrid"><label>Potential purchase ($)<input name="amount" type="number" min="0" step="0.01" value="100" required></label><label>Safety buffer ($)<input name="buffer" type="number" min="0" step="1" value="${Number(db.settings.buffer)||0}" required></label><div class="wide"><button class="primary">Check purchase</button></div></form><div id="planResult" class="notice" style="margin-top:15px">Current lowest projected cash: <strong>${money(f.min)}</strong>. After buffer: <strong>${money(f.min-db.settings.buffer)}</strong>.</div></section><section class="card">${heading('30-day cash-flow forecast')}${lineChart(f.points)}<div class="scroll"><table><thead><tr><th>Date</th><th>Scheduled event</th><th>Amount</th></tr></thead><tbody>${f.events.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.name)}</td><td>${e.type==='income'?'+':'−'}${money(e.amount)}</td></tr>`).join('')||'<tr><td colspan="3">No upcoming events.</td></tr>'}</tbody></table></div></section>`}function settings(){return `<section class="card">${heading('Backup & privacy')}<p class="muted">Data is saved only in this browser's localStorage. It is not encrypted, does not sync across devices, and may disappear when browser data is cleared. Export a backup after meaningful changes. Backups contain sensitive financial details.</p><div class="actions"><button class="primary" id="export">Export JSON backup</button><label class="secondary" style="display:inline-block;cursor:pointer">Restore JSON backup<input type="file" id="restore" accept=".json,application/json" style="display:none"></label></div><p class="muted">Restore replaces all current data after confirmation.</p></section><section class="card">${heading('Demo and reset')}<div class="actions"><button class="secondary" id="demo">Load fictional demo data</button><button class="secondary danger" id="reset">Erase all PRISM data</button></div><p class="muted">Demo mode replaces your existing data after confirmation. Export a backup first if needed.</p></section><section class="card">${heading('Limitations of v0.1')}<p class="muted">No automatic reconciliation, interest calculations, transaction editing, or multi-device syncing. The forecast does not deduct unspent category budgets, and scheduled bills are not automatically reconciled against actual transactions. Use it as a planning aid, not a bank ledger.</p></section>`}const views={overview,transactions,budgets,accounts,recurring,planner,settings};const labels={overview:'Overview',transactions:'Transactions',budgets:'Budgets',accounts:'Accounts',recurring:'Recurring',planner:'Forecast & purchase',settings:'Backup & settings'};function render(){document.getElementById('tabs').innerHTML=Object.entries(labels).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${v}</button>`).join('');document.getElementById('app').innerHTML=views[tab]();document.getElementById('mode').textContent=db.demo?'DEMO DATA':'LOCAL ONLY'}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.delete){let {delete:kind,id}=b.dataset;if(!confirm('Delete this item?'))return;if(kind==='tx')db.transactions=db.transactions.filter(t=>t.id!==id);if(kind==='rec')db.recurring=db.recurring.filter(t=>t.id!==id);if(kind==='account'){if(db.transactions.some(t=>t.account===id||t.to===id)||db.recurring.some(r=>r.account===id)){alert('Remove transactions and scheduled items linked to this account first.');return}if(db.accounts.length===1){alert('Keep at least one account.');return}db.accounts=db.accounts.filter(a=>a.id!==id)}save();render();return}if(b.dataset.editAccount){let a=account(b.dataset.editAccount);let name=prompt('Account nickname',a.name);if(name===null)return;let balance=prompt('Starting balance (not current balance)',a.balance);if(balance===null)return;if(!name.trim()||!Number.isFinite(Number(balance))||balance.trim()===''){alert('Invalid values');return}a.name=name.trim();a.balance=Number(balance);save();render();return}if(b.id==='export'){let blob=new Blob([JSON.stringify({app:'Financial PRISM',version:1,exported:today(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='financial-prism-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(b.id==='reset'&&confirm('Permanently erase ALL local PRISM data? Export a backup first.')&&confirm('Confirm permanent erase?')){db=defaultData();save();tab='overview';render()}if(b.id==='demo'){if(!confirm('Replace current data with fictional demo data? Back up real data first.'))return;let m=month();db={accounts:[{id:'c',name:'Everyday checking',type:'cash',balance:4200},{id:'s',name:'Savings',type:'cash',balance:2400},{id:'v',name:'Credit card',type:'debt',balance:-1800}],transactions:[{id:uid(),date:m+'-03',type:'income',account:'c',amount:4200,category:'Other',note:'Paycheck'},{id:uid(),date:m+'-04',type:'expense',account:'c',amount:1550,category:'Housing',note:'Rent'},{id:uid(),date:m+'-06',type:'expense',account:'v',amount:145,category:'Groceries',note:'Market'},{id:uid(),date:m+'-07',type:'expense',account:'v',amount:62,category:'Dining',note:'Dinner'}],budgets:{Housing:1600,Groceries:550,Dining:250,Transportation:300,Entertainment:150},recurring:[{id:uid(),name:'Paycheck',type:'income',amount:4200,frequency:'biweekly',start:addDays(today(),7),account:'c',category:'Other'},{id:uid(),name:'Rent',type:'expense',amount:1550,frequency:'monthly',start:addDays(today(),12),day:Number(addDays(today(),12).slice(8)),account:'c',category:'Housing'}],settings:{buffer:750},demo:true};save();tab='overview';render()}});document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f));if(f.id==='txForm'){let amount=Number(d.amount);if(!(amount>0))return;if(d.type==='transfer'&&(!d.to||d.to===d.account)){alert('Select a different destination account.');return}db.transactions.push({...d,id:uid(),amount});}if(f.id==='accountForm'){if(!d.name.trim()||!Number.isFinite(Number(d.balance)))return;db.accounts.push({id:uid(),name:d.name.trim(),type:d.type,balance:Number(d.balance)})}if(f.id==='budgetForm'){db.budgets=Object.fromEntries(cats.map(c=>[c,Math.max(0,Number(d[c])||0)]))}if(f.id==='recForm'){if(Number(d.amount)<=0||d.end&&d.end<d.start){alert('Check amount and dates.');return}db.recurring.push({...d,id:uid(),amount:Number(d.amount),day:Number(d.start.slice(8))})}if(f.id==='planForm'){db.settings.buffer=Number(d.buffer);save();let min=forecast().min,remaining=min-Number(d.buffer)-Number(d.amount);document.getElementById('planResult').innerHTML=`<strong class="${remaining>=0?'good':'bad'}">${remaining>=0?'Within your projected cash buffer':'Would breach your projected cash buffer'}</strong><p>Lowest 30-day balance after this purchase and buffer: <strong>${money(remaining)}</strong>.</p><p class="muted">This is a cash-only check, not a recommendation to spend.</p>`;return}save();render()});document.addEventListener('change',async e=>{if(e.target.id!=='restore')return;let file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error('Backup too large');let obj=JSON.parse(await file.text());let x=obj.data;if(obj.app!=='Financial PRISM'||obj.version!==1||!x||!Array.isArray(x.accounts)||!Array.isArray(x.transactions)||!Array.isArray(x.recurring)||!x.budgets||!x.settings||!x.accounts.length)throw Error('Invalid PRISM v0.1 backup');if(!confirm('Replace ALL current PRISM data with this backup?'))return;db=x;save();tab='overview';render()}catch(err){alert('Restore failed: '+err.message)}});render();
</script></body></html>
