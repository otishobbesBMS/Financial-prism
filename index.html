<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial PRISM · v0.5</title><style>
:root{font:15px system-ui,-apple-system,sans-serif;color:#23364b;background:#fbfcfd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 5% 4%,#dceff0a8,transparent 42%),radial-gradient(ellipse at 96% 8%,#ece2f4a6,transparent 40%),radial-gradient(ellipse at 72% 96%,#e0f2e8a6,transparent 42%),#fbfcfd;background-attachment:fixed}header{padding:17px max(16px,calc((100vw - 1150px)/2));background:#ffffffdf;border-bottom:1px solid #c5d4dd}h1{font-size:22px;margin:0;letter-spacing:.035em}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:12px 0 8px}.sub,.muted{color:#52687a;font-size:13px}.shell{max-width:1150px;margin:auto;padding:16px}nav{display:flex;overflow:auto;gap:7px;padding-bottom:8px;margin-bottom:10px}button{cursor:pointer;font:inherit;border-radius:10px;padding:10px 12px;border:1px solid #a5bac8;background:white;color:#284458}button.active,button.primary{background:linear-gradient(115deg,#d2ece8,#e8e2f5);border-color:#80a9b1;color:#203e50;font-weight:700}.card{background:#fffffff2;border:1px solid #b8cbd7;border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 6px 25px #344e6410}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid .card,.grid3 .card{margin-bottom:0}.metric{font-size:26px;font-weight:750;overflow-wrap:anywhere}.good{color:#126b54}.bad{color:#a7374c}.warn{color:#8a590d}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form label{display:grid;gap:5px;font-size:13px;font-weight:600;color:#334d61}input,select{width:100%;padding:10px;border:1px solid #9eb3c2;border-radius:9px;background:white;color:#20364a;font:inherit}input[type=checkbox]{width:auto}.full{grid-column:1/-1}.item{padding:12px 0;border-bottom:1px solid #d9e3e9}.item:last-child{border-bottom:0}.notice{background:#f2f9f9;border:1px solid #bfd5da;border-radius:12px;padding:12px;margin-bottom:13px;color:#3b5569}.bar{height:9px;background:#e4ebef;border-radius:20px;overflow:hidden}.fill{height:100%;background:#6c9eab}.fill.over{background:#b95e71}.pill{font-size:11px;border:1px solid #b1c8d0;padding:3px 8px;border-radius:15px;background:#f9fcfd}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #d6e1e8}th{color:#456073}td{white-space:nowrap}.actions{display:flex;flex-wrap:wrap;gap:7px}.tiny{padding:5px 8px;font-size:12px}.danger{color:#a7374c}.hidden{display:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #78a6b5;outline-offset:2px}@media(max-width:700px){.shell{padding:11px}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.form{grid-template-columns:1fr}.metric{font-size:22px}.card{padding:14px}}@media(max-width:390px){.grid,.grid3{grid-template-columns:1fr}}
</style></head><body><header><h1>◈ FINANCIAL PRISM</h1><div class="sub">v0.4 · Pearl Clear · Debt & cash-flow</div></header><main class="shell"><div class="notice">Local-only planning tool. Balances are snapshots as of today; transactions already included in those balances are not applied again. Browser data is not encrypted or guaranteed to persist. Export backups regularly.</div><nav id="nav"></nav><div id="app"></div></main><script>
'use strict';const KEY='financial-prism-v04',OLD='financial-prism-v01',cats=['Housing','Utilities','Groceries','Dining','Transportation','Insurance','Health','Children & Family','Business','Entertainment','Shopping','Subscriptions','Debt Payments','Savings','Other'];const date=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(+n||0);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2);const num=x=>Number(x)||0;const add=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const mon=()=>date().slice(0,7);const blank=()=>({accounts:[{id:uid(),name:'Main checking',type:'cash',balance:0,asof:date()}],transactions:[],recurring:[],budgets:{},settings:{buffer:500},demo:false});let db,tab='home',editRec=null,editAcct=null;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db){let old;try{old=JSON.parse(localStorage.getItem(OLD))}catch{}if(old?.accounts?.length){db={...old,accounts:old.accounts.map(a=>({...a,asof:date(),limit:a.limit||0,apr:a.apr||0})),transactions:old.transactions||[],recurring:old.recurring||[],settings:old.settings||{buffer:500},demo:old.demo||false};db.migrated=true}else db=blank()}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Save failed: export a backup. '+e.message)}}const acct=id=>db.accounts.find(a=>a.id===id);const isDebt=a=>a?.type==='debt'||a?.type==='loan';const opts=(items,sel)=>items.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(t)}</option>`).join('');const accopts=(sel)=>opts(db.accounts.map(a=>[a.id,a.name]),sel);const categories=sel=>opts(cats.map(c=>[c,c]),sel);const balanceLabel=a=>isDebt(a)?'Amount owed':'Available balance';const current=a=>num(a.balance);const shown=a=>isDebt(a)?Math.max(0,-current(a)):current(a);function apply(b,e){let n=num(e.amount),a=acct(e.account);if(!a)return;if(e.type==='income')b[e.account]=(b[e.account]||0)+n;else if(e.type==='expense')b[e.account]=(b[e.account]||0)-n;else if(e.type==='transfer'&&acct(e.to)&&e.to!==e.account){b[e.account]=(b[e.account]||0)-n;b[e.to]=(b[e.to]||0)+n}}function occurrences(r,start,end){let out=[],d=r.start;if(!d)return out;let i=0;while(d<=end&&i++<1500){if(d>=start&&(!r.end||d<=r.end))out.push({...r,date:d,scheduled:true});if(r.frequency==='once')break;if(r.frequency==='weekly')d=add(d,7);else if(r.frequency==='biweekly')d=add(d,14);else if(r.frequency==='monthly'){let base=new Date(r.start+'T12:00:00'),day=base.getDate(),target=new Date(base.getFullYear(),base.getMonth()+i,1,12),last=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();target.setDate(Math.min(day,last));d=`${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`}else break}return out}function forecast(days=30){let start=date(),end=add(start,days),b=Object.fromEntries(db.accounts.map(a=>[a.id,current(a)]));let events=[];for(let r of db.recurring)events.push(...occurrences(r,add(start,1),end));for(let t of db.transactions)if(t.date>start&&t.date<=end)events.push({...t,scheduled:false,name:t.note||'Planned transaction'});events.sort((a,b)=>a.date.localeCompare(b.date)||Number(a.scheduled)-Number(b.scheduled));let rows=[{date:start,b:{...b},events:[]}],byDay={};for(let e of events)(byDay[e.date]??=[]).push(e);for(let i=1;i<=days;i++){let day=add(start,i);for(let e of byDay[day]||[])apply(b,e);rows.push({date:day,b:{...b},events:byDay[day]||[]})}return {rows,events}}function cash(b){return db.accounts.filter(a=>a.type==='cash').reduce((s,a)=>s+num(b[a.id]),0)}function status(){let f=forecast(),cashlow=Math.min(...f.rows.map(r=>cash(r.b))),worst=f.rows.find(r=>cash(r.b)===cashlow),negative=[];for(let a of db.accounts.filter(a=>a.type==='cash')){let r=f.rows.find(x=>num(x.b[a.id])<0);if(r)negative.push({a,date:r.date,amount:r.b[a.id]})}return {f,cashlow,worst,negative}}function recurringMonthly(r){let start=date(),end=add(start,364);return occurrences(r,start,end).reduce((s,e)=>s+(e.type==='income'?1:e.type==='expense'?-1:0)*num(e.amount),0)/12}function monthly(){let income=0,out=0;for(let r of db.recurring){let n=recurringMonthly(r);if(n>0)income+=n;else out-=n}return {income,out,net:income-out}}function home(){let s=status(),m=monthly(),debt=db.accounts.filter(isDebt).reduce((v,a)=>v+shown(a),0),over=db.accounts.filter(a=>a.type==='debt'&&num(a.limit)>0&&shown(a)>num(a.limit));return `<div class="grid3"><section class="card"><div class="muted">Scheduled monthly income · approx.</div><div class="metric">${fmt(m.income)}</div></section><section class="card"><div class="muted">Scheduled monthly expenses · approx.</div><div class="metric">${fmt(m.out)}</div></section><section class="card"><div class="muted">Recurring monthly gap</div><div class="metric ${m.net<0?'bad':'good'}">${fmt(m.net)}</div></section><section class="card"><div class="muted">Cash across accounts now</div><div class="metric">${fmt(cash(Object.fromEntries(db.accounts.map(a=>[a.id,current(a)]))))}</div></section><section class="card"><div class="muted">Lowest total cash · next 30 days</div><div class="metric ${s.cashlow<0?'bad':''}">${fmt(s.cashlow)}</div><div class="muted">${s.worst.date}</div></section><section class="card"><div class="muted">Tracked debt outstanding</div><div class="metric">${fmt(debt)}</div></section></div><section class="card"><h2>What needs attention</h2>${m.net<0?`<div class="item"><strong class="bad">Recurring expenses exceed recurring income by about ${fmt(-m.net)}/month.</strong><div class="muted">Based only on entered schedules. Variable expenses and unscheduled interest may increase the gap.</div></div>`:'<div class="item">No deficit identified from entered recurring schedules. This is not a full spending assessment.</div>'}${s.negative.map(x=>`<div class="item"><strong class="bad">${esc(x.a.name)} projected below zero on ${x.date}</strong><div class="muted">Projected balance ${fmt(x.amount)}</div></div>`).join('')}${over.map(a=>`<div class="item"><strong class="bad">${esc(a.name)} over credit limit by ${fmt(shown(a)-num(a.limit))}</strong></div>`).join('')}${!s.negative.length&&!over.length?'<div class="item muted">No negative cash balances or over-limit cards detected in the entered data.</div>':''}</section><section class="card"><h2>Next scheduled movements</h2>${eventTable(s.f.events.slice(0,12))}<p class="muted">Recurring items are forecasts, not completed transactions. Update account snapshots when reconciling to actual bank balances.</p></section>`}function eventTable(events){return `<div class="scroll"><table><thead><tr><th>Date</th><th>Item</th><th>From / account</th><th>To</th><th>Amount</th></tr></thead><tbody>${events.map(e=>`<tr><td>${e.date}</td><td>${esc(e.name||e.note||'Transaction')}${e.scheduled?' ◌':''}</td><td>${esc(acct(e.account)?.name||'?')}</td><td>${e.type==='transfer'?esc(acct(e.to)?.name||'?'):'·'}</td><td>${e.type==='income'?'+':e.type==='expense'?'−':'↔'}${fmt(e.amount)}</td></tr>`).join('')||'<tr><td colspan="5">No scheduled entries</td></tr>'}</tbody></table></div>`}function accounts(){return `<section class="card"><h2>${editAcct?'Edit account':'Add account'}</h2><form id="accountForm" class="form"><label>Name<input name="name" required value="${esc(editAcct?.name||'')}"></label><label>Type<select name="type">${opts([['cash','Checking / savings / cash'],['debt','Credit card'],['loan','Loan']],editAcct?.type||'cash')}</select></label><label>Today's balance ($)<input name="balance" type="number" step=".01" required value="${editAcct?num(editAcct.balance):0}"></label><label>Credit limit ($)<input name="limit" type="number" min="0" step=".01" value="${num(editAcct?.limit)}"></label><label>APR (% annual)<input name="apr" type="number" min="0" max="1000" step=".001" value="${num(editAcct?.apr)}"></label><label>Notes (optional)<input name="note" value="${esc(editAcct?.note||'')}"></label><div class="full muted">For credit cards and loans, enter debt owed as a <strong>negative balance</strong> (for example, −2500). Use the amount your institution currently shows, as of today. APR is informational; interest is not automatically calculated.</div><div class="full actions"><button class="primary">${editAcct?'Save changes':'Add account'}</button>${editAcct?'<button type="button" id="cancelAcct">Cancel</button>':''}</div></form></section><section class="card"><h2>Accounts & credit utilization</h2>${db.accounts.map(a=>{let debt=isDebt(a),used=shown(a),limit=num(a.limit),over=debt&&a.type==='debt'&&limit>0&&used>limit;return `<div class="item"><div class="row wrap"><div><strong>${esc(a.name)}</strong><div class="muted">${a.type==='cash'?'Cash account':a.type==='loan'?'Loan':'Credit card'} · ${debt?'owed':'balance'} ${fmt(used)}${a.apr?` · APR ${num(a.apr)}%`:''}</div></div><div class="actions"><button class="tiny" data-editacct="${esc(a.id)}">Edit</button><button class="tiny danger" data-delete="account" data-id="${esc(a.id)}">Delete</button></div></div>${a.type==='debt'&&limit>0?`<div class="bar" style="margin-top:9px"><div class="fill ${over?'over':''}" style="width:${Math.min(100,used/limit*100)}%"></div></div><div class="muted">${(used/limit*100).toFixed(1)}% of ${fmt(limit)} limit${over?` · <strong class="bad">${fmt(used-limit)} over limit</strong>`:` · ${fmt(limit-used)} remaining`}</div>`:''}</div>`}).join('')}</section>`}function recForm(){let r=editRec||{},first=db.accounts[0]?.id;return `<section class="card"><h2>${editRec?'Edit recurring item':'Add recurring income, charge, payment, or transfer'}</h2><form id="recForm" class="form"><label>Description<input name="name" required value="${esc(r.name||'')}"></label><label>Movement<select name="type" id="recType">${opts([['expense','Expense / credit card charge'],['income','Income'],['transfer','Transfer / credit card or loan payment']],r.type||'expense')}</select></label><label>Amount ($)<input name="amount" type="number" min=".01" step=".01" required value="${r.amount??''}"></label><label>Frequency<select name="frequency">${opts([['monthly','Monthly'],['biweekly','Every 2 weeks'],['weekly','Weekly'],['once','Once']],r.frequency||'monthly')}</select></label><label>First date<input name="start" type="date" required value="${esc(r.start||add(date(),1))}"></label><label>End date (optional)<input name="end" type="date" value="${esc(r.end||'')}"></label><label>Account charged / money from<select name="account">${accopts(r.account||first)}</select></label><label>Destination account (transfers only)<select name="to"><option value="">Not applicable</option>${accopts(r.to)}</select></label><label>Category<select name="category">${categories(r.category||'Other')}</select></label><div class="full muted">A charge to a credit card increases debt. A transfer from checking to a credit card reduces checking cash and card debt. Record card payments as transfers, not expenses, to avoid double-counting.</div><div class="full actions"><button class="primary">${editRec?'Save recurring item':'Add recurring item'}</button>${editRec?'<button type="button" id="cancelRec">Cancel edit</button>':''}</div></form></section><section class="card"><h2>Recurring schedule</h2>${db.recurring.map(r=>`<div class="item row wrap"><div><strong>${esc(r.name)}</strong><div class="muted">${esc(r.frequency)} · ${esc(r.start)} · ${esc(r.type)} · ${esc(acct(r.account)?.name||'Unknown')}${r.type==='transfer'?` → ${esc(acct(r.to)?.name||'Unknown')}`:''}</div></div><div class="actions"><strong>${fmt(r.amount)}</strong><button class="tiny" data-editrec="${esc(r.id)}">Edit</button><button class="tiny danger" data-delete="rec" data-id="${esc(r.id)}">Delete</button></div></div>`).join('')||'<p class="muted">No recurring items entered yet.</p>'}</section>`}function transactions(){return `<section class="card"><h2>Record a transaction or planned movement</h2><form id="txForm" class="form"><label>Date<input type="date" name="date" value="${date()}" required></label><label>Type<select name="type">${opts([['expense','Expense / charge'],['income','Income'],['transfer','Transfer / debt payment']])}</select></label><label>Amount<input type="number" name="amount" min=".01" step=".01" required></label><label>From / account<select name="account">${accopts()}</select></label><label>To (transfers only)<select name="to"><option value="">Not applicable</option>${accopts()}</select></label><label>Category<select name="category">${categories()}</select></label><label class="full">Description<input name="note"></label><div class="full muted">Transactions dated today or earlier are history only and do not change today's entered account snapshot. Future-dated transactions affect forecasts. When your actual bank balance changes, edit the account snapshot to match.</div><div class="full"><button class="primary">Save transaction</button></div></form></section><section class="card"><h2>Transaction history & planned items</h2>${eventTable([...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,80))}${db.transactions.map(t=>`<div class="item row"><span class="muted">${t.date} · ${esc(t.note||t.type)}</span><button class="tiny danger" data-delete="tx" data-id="${esc(t.id)}">Delete</button></div>`).join('')}</section>`}function assumptions(){return {...{miles:70,days:70,mpg:23,gas:5,two:600,six:1650,occupancy:45,share:65},...(db.settings?.living||{})}}function benchmarks(){let x=assumptions();return {fuel:x.miles*30.44*x.days/100/x.mpg*x.gas,grocery:(x.two*(1-x.occupancy/100)+x.six*x.occupancy/100)*x.share/100}}function living(){let x=assumptions(),b=benchmarks();let fields=[['miles','Round-trip commute (miles)',1,250,1],['days','Calendar days commuting (%)',0,100,1],['mpg','Vehicle efficiency (mpg)',1,100,.1],['gas','Gas price ($/gallon)',0,20,.01],['two','Two-person monthly grocery baseline ($)',0,10000,1],['six','Six-person monthly grocery baseline ($)',0,20000,1],['occupancy','Six-person occupancy (% of time)',0,100,1],['share','Your grocery contribution (%)',0,100,1]];return `<section class="card"><h2>Local cost-of-living assumptions</h2><p class="muted">Your White Center–Tacoma commute and variable household size. These are planning assumptions, not bank transactions, independently verified local prices, or affordability judgments.</p><form id="livingForm" class="form">${fields.map(([key,label,min,max,step])=>`<label>${label}<input type="number" name="${key}" min="${min}" max="${max}" step="${step}" value="${x[key]}" required></label>`).join('')}<div class="full actions"><button class="primary">Save assumptions</button></div></form></section><div class="grid3"><section class="card"><div class="muted">Commute gasoline / month</div><div class="metric">${fmt(b.fuel)}</div><p class="muted">Does not include personal driving, parking, tolls, or maintenance.</p></section><section class="card"><div class="muted">Your grocery share / month</div><div class="metric">${fmt(b.grocery)}</div><p class="muted">Weighted for changing household occupancy.</p></section><section class="card"><div class="muted">Combined planning baseline</div><div class="metric">${fmt(b.fuel+b.grocery)}</div><p class="muted">Not automatically deducted from account balances.</p></section></div><section class="card"><h2>Compare against your category budgets</h2><div class="item">Transportation budget: <strong>${db.budgets.Transportation?fmt(db.budgets.Transportation):'Not set'}</strong> · commute fuel benchmark: <strong>${fmt(b.fuel)}</strong></div><div class="item">Groceries budget: <strong>${db.budgets.Groceries?fmt(db.budgets.Groceries):'Not set'}</strong> · contribution benchmark: <strong>${fmt(b.grocery)}</strong></div><p class="muted">Your transportation budget may need to exceed the commute benchmark. Benchmarks are not automatically added to recurring charges or category budgets, to prevent double-counting. Use the Budgets tab to set your limits.</p><button id="useBenchmarks">Copy benchmarks into category budgets</button><p class="muted">This updates the Transportation and Groceries budget targets only, not any account balances or transactions.</p></section>`}function budgets(){let monthSpend=c=>db.transactions.filter(t=>t.type==='expense'&&t.category===c&&t.date.slice(0,7)===mon()).reduce((s,t)=>s+num(t.amount),0);return `<section class="card"><h2>Monthly category limits</h2><p class="muted">Actual transaction tracking is separate from the forward cash-flow forecast. Entered monthly category limits do not automatically reserve cash in the forecast.</p><form id="budgetForm" class="form">${cats.map(c=>`<label>${esc(c)}<input name="${esc(c)}" type="number" min="0" step="1" value="${num(db.budgets[c])}"></label>`).join('')}<div class="full"><button class="primary">Save budgets</button></div></form></section><section class="card"><h2>This month's recorded expenses</h2>${cats.filter(c=>num(db.budgets[c])||monthSpend(c)).map(c=>{let spent=monthSpend(c),limit=num(db.budgets[c]);return `<div class="item"><div class="row"><strong>${esc(c)}</strong><span>${fmt(spent)} / ${limit?fmt(limit):'not set'}</span></div>${limit?`<div class="bar"><div class="fill ${spent>limit?'over':''}" style="width:${Math.min(100,spent/limit*100)}%"></div></div>`:''}</div>`}).join('')||'<p class="muted">No budgets or expenses entered yet.</p>'}</section>`}function projections(){let f=forecast(60);return `<section class="card"><h2>Projected balances by account · next 60 days</h2><p class="muted">Every scheduled expense, income, transfer and future-dated transaction is applied to its selected account. Variable credit interest, unentered charges and unscheduled expenses are not estimated.</p><div class="scroll"><table><thead><tr><th>Date</th>${db.accounts.map(a=>`<th>${esc(a.name)}</th>`).join('')}<th>Total cash</th></tr></thead><tbody>${f.rows.filter((r,i)=>i===0||r.events.length||i===60).map(r=>`<tr><td>${r.date}</td>${db.accounts.map(a=>`<td class="${a.type==='cash'&&r.b[a.id]<0?'bad':''}">${fmt(isDebt(a)?-r.b[a.id]:r.b[a.id])}${isDebt(a)?' owed':''}</td>`).join('')}<td class="${cash(r.b)<0?'bad':''}">${fmt(cash(r.b))}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>Upcoming events</h2>${eventTable(f.events)}</section>`}function transfers(){let f=forecast(30),buffer=num(db.settings.buffer),low=Math.min(...f.rows.map(r=>cash(r.b)));return `<section class="card"><h2>Funding and transfer planning</h2><p class="muted">Transfers between accounts move money without creating an expense. A payment from checking to a credit card lowers checking cash and reduces card debt.</p><form id="bufferForm" class="form"><label>Desired total cash reserve ($)<input name="buffer" type="number" min="0" step="1" value="${buffer}"></label><div style="align-self:end"><button class="primary">Save reserve</button></div></form><div class="item">Lowest forecast cash after reserve: <strong class="${low-buffer<0?'bad':'good'}">${fmt(low-buffer)}</strong></div><h3>Potential transfer or purchase</h3><form id="testForm" class="form"><label>Amount ($)<input name="amount" type="number" min=".01" step=".01" required></label><label>From account<select name="from">${accopts()}</select></label><label>To account (optional)<select name="to"><option value="">Purchase / cash outflow</option>${accopts()}</select></label><div class="full"><button class="primary">Test impact</button></div></form><div id="testResult" class="notice" style="margin-top:12px">Enter a proposed movement to see the impact on projected account balances.</div></section><section class="card"><h2>Account funding alerts</h2>${db.accounts.filter(a=>a.type==='cash').map(a=>{let first=f.rows.find(r=>r.b[a.id]<0),min=Math.min(...f.rows.map(r=>r.b[a.id]));return `<div class="item"><strong>${esc(a.name)}</strong><div class="muted">30-day low: ${fmt(min)}${first?` · <span class="bad">below zero ${first.date}; at least ${fmt(-min)} needed to avoid a negative balance (before reserve)</span>`:' · No projected negative balance'}</div></div>`}).join('')}</section>`}function settings(){return `<section class="card"><h2>Backup & restore</h2><p class="muted">Your information stays in this browser unless you export it. Browser storage is not encrypted, can be cleared, and does not sync between devices. Keep backups somewhere private. Do not upload them to a public GitHub repository.</p><div class="actions"><button id="export" class="primary">Export JSON backup</button><label style="padding:10px;border:1px solid #a5bac8;border-radius:10px;cursor:pointer">Restore backup<input id="restore" type="file" accept=".json" class="hidden"></label></div></section><section class="card"><h2>Demo / reset</h2><div class="actions"><button id="demo">Load fictional demo</button><button id="reset" class="danger">Erase all local data</button></div><p class="muted">Loading demo replaces existing data. Export a backup first.</p></section><section class="card"><h2>How balances work</h2><p class="muted">Today's balance is the source of truth. Transactions on or before today are recorded for history and budgets, not reapplied to that balance. Recurring items forecast from tomorrow onward. Interest, variable fees, taxes, and unentered charges are not auto-generated. Update snapshots when reconciling. Recurring events are not automatically matched to recorded transactions, so avoid duplicating a future event in both places.</p></section>`}const views={home,accounts,recForm,transactions,budgets,living,projections,transfers,settings},labels={home:'Overview',accounts:'Accounts & debt',recForm:'Recurring',transactions:'Transactions',budgets:'Budgets',living:'Living costs',projections:'Account forecasts',transfers:'Transfers & funding',settings:'Backup & settings'};function render(){document.getElementById('nav').innerHTML=Object.entries(labels).map(([k,v])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('');document.getElementById('app').innerHTML=views[tab]();}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.editrec){editRec=db.recurring.find(r=>r.id===b.dataset.editrec);tab='recForm';render();scrollTo(0,0);return}if(b.dataset.editacct){editAcct=acct(b.dataset.editacct);tab='accounts';render();scrollTo(0,0);return}if(b.id==='cancelRec'){editRec=null;render();return}if(b.id==='cancelAcct'){editAcct=null;render();return}if(b.dataset.delete){let id=b.dataset.id;if(!confirm('Delete this entry?'))return;if(b.dataset.delete==='rec')db.recurring=db.recurring.filter(x=>x.id!==id);if(b.dataset.delete==='tx')db.transactions=db.transactions.filter(x=>x.id!==id);if(b.dataset.delete==='account'){if(db.accounts.length<2||db.recurring.some(x=>x.account===id||x.to===id)||db.transactions.some(x=>x.account===id||x.to===id)){alert('Account is linked to other entries or is the last account. Remove linked entries first.');return}db.accounts=db.accounts.filter(x=>x.id!==id)}save();render();return}if(b.id==='useBenchmarks'){if(confirm('Set Groceries and Transportation budget targets to these rounded benchmarks? Existing targets for those two categories will be replaced.')){let x=benchmarks();db.budgets.Groceries=Math.round(x.grocery);db.budgets.Transportation=Math.round(x.fuel);save();render()}return}if(b.id==='export'){let blob=new Blob([JSON.stringify({app:'Financial PRISM',version:5,exported:date(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='financial-prism-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}if(b.id==='reset'&&confirm('Erase ALL locally stored financial data?')&&confirm('This cannot be undone without a backup. Continue?')){db=blank();editRec=editAcct=null;save();tab='home';render()}if(b.id==='demo'){if(!confirm('Replace current data with fictional demonstration records? Export a backup first.'))return;let c='c',v='v',s='s';db={accounts:[{id:c,name:'Main checking',type:'cash',balance:2600,asof:date()},{id:s,name:'Bills checking',type:'cash',balance:450,asof:date()},{id:v,name:'Credit card',type:'debt',balance:-5400,limit:5000,apr:24.99,asof:date()}],transactions:[],recurring:[{id:uid(),name:'Paycheck',type:'income',amount:3200,frequency:'biweekly',start:add(date(),5),account:c,category:'Other'},{id:uid(),name:'Housing',type:'expense',amount:2100,frequency:'monthly',start:add(date(),8),account:c,category:'Housing'},{id:uid(),name:'Business subscription',type:'expense',amount:75,frequency:'monthly',start:add(date(),3),account:v,category:'Business'},{id:uid(),name:'Credit card payment',type:'transfer',amount:350,frequency:'monthly',start:add(date(),11),account:c,to:v,category:'Debt Payments'},{id:uid(),name:'Fund bills account',type:'transfer',amount:500,frequency:'monthly',start:add(date(),7),account:c,to:s,category:'Other'},{id:uid(),name:'Utility bill',type:'expense',amount:200,frequency:'monthly',start:add(date(),9),account:s,category:'Utilities'}],budgets:{Groceries:600,Dining:200},settings:{buffer:500},demo:true};save();tab='home';render()}});document.addEventListener('submit',e=>{e.preventDefault();let form=e.target,d=Object.fromEntries(new FormData(form));if(form.id==='accountForm'){let a={id:editAcct?.id||uid(),name:d.name.trim(),type:d.type,balance:num(d.balance),limit:num(d.limit),apr:num(d.apr),note:d.note,asof:date()};if(!a.name)return;if(editAcct)Object.assign(editAcct,a);else db.accounts.push(a);editAcct=null}if(form.id==='recForm'){if(num(d.amount)<=0||d.end&&d.end<d.start)return alert('Check amount and dates');if(d.type==='transfer'&&(!d.to||d.to===d.account))return alert('Choose different source and destination accounts');let r={...d,id:editRec?.id||uid(),amount:num(d.amount)};if(editRec)Object.assign(editRec,r);else db.recurring.push(r);editRec=null}if(form.id==='txForm'){if(num(d.amount)<=0)return;if(d.type==='transfer'&&(!d.to||d.to===d.account))return alert('Choose different source and destination accounts');db.transactions.push({...d,id:uid(),amount:num(d.amount)})}if(form.id==='budgetForm')db.budgets=Object.fromEntries(cats.map(c=>[c,Math.max(0,num(d[c]))]));if(form.id==='livingForm'){let x={};for(let k of ['miles','days','mpg','gas','two','six','occupancy','share'])x[k]=num(d[k]);if(x.mpg<=0||x.days>100||x.occupancy>100||x.share>100)return alert('Please check the assumptions.');db.settings.living=x}if(form.id==='bufferForm')db.settings.buffer=Math.max(0,num(d.buffer));if(form.id==='testForm'){let n=num(d.amount),f=forecast(),from=d.from,to=d.to;if(to&&to===from)return alert('Choose different accounts');let minFrom=Math.min(...f.rows.map(r=>num(r.b[from])-n));let minCash=Math.min(...f.rows.map(r=>cash(r.b)-(acct(from)?.type==='cash'?n:0)+(to&&acct(to)?.type==='cash'?n:0)));let ok=minFrom>=0&&minCash>=num(db.settings.buffer);document.getElementById('testResult').innerHTML=`<strong class="${ok?'good':'bad'}">${ok?'No projected reserve breach detected':'Potential funding shortfall'}</strong><div>Lowest projected source balance after movement: ${fmt(minFrom)}. Lowest total cash after movement: ${fmt(minCash)} (reserve ${fmt(db.settings.buffer)}).</div><div class="muted">Assumes this movement happens now and all entered schedules are accurate. Does not include unknown expenses.</div>`;return}save();render()});document.addEventListener('change',async e=>{if(e.target.id!=='restore')return;try{let file=e.target.files[0];if(!file||file.size>5000000)throw Error('No file or file too large');let x=JSON.parse(await file.text());if(x.app!=='Financial PRISM'||![1,4,5].includes(x.version)||!x.data||!Array.isArray(x.data.accounts)||!Array.isArray(x.data.recurring)||!Array.isArray(x.data.transactions)||!x.data.accounts.length)throw Error('Invalid backup');if(!confirm('Replace all local PRISM data with backup?'))return;db=x.data;db.accounts=db.accounts.map(a=>({...a,asof:date()}));db.settings??={buffer:500};db.budgets??={};editAcct=editRec=null;save();tab='home';render()}catch(err){alert('Restore failed: '+err.message)}});save();render();
</script></body></html>
